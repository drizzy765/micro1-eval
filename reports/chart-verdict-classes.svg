<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" role="img" aria-label="What failed trials look like">
<text x="20" y="24" font-family="sans-serif" font-size="15" font-weight="bold">Failed trials by verdict class (72 failed unique trials)</text>
<text x="20" y="42" font-family="sans-serif" font-size="11" fill="#555">Muse 24 + GLM 24 + Gemini 24 failed trials; GPT excluded (aggregate-only)</text>
<g font-family="sans-serif" font-size="12">
<text x="20" y="80">Muse Spark 1.3 (vision)</text><rect x="230" y="64" width="200" height="18" fill="#c62828"/><rect x="430" y="64" width="40" height="18" fill="#757575"/><text x="475" y="79">20 / 4 / 0</text>
<text x="20" y="110">GLM 5.3 Flash (text)</text><rect x="230" y="94" width="230" height="18" fill="#c62828"/><rect x="460" y="94" width="10" height="18" fill="#757575"/><text x="475" y="109">23 / 1 / 0</text>
<text x="20" y="140">Gemini 2.5 Flash (text)</text><rect x="230" y="124" width="240" height="18" fill="#c62828"/><text x="475" y="139">24 / 0 / 0</text>
</g>
<g font-family="sans-serif" font-size="12">
<rect x="20" y="170" width="14" height="14" fill="#c62828"/><text x="40" y="182">off-schema text label (67)</text>
<rect x="20" y="192" width="14" height="14" fill="#757575"/><text x="40" y="204">non-JSON response, runner fallback UNVERIFIED (5)</text>
<rect x="20" y="214" width="14" height="14" fill="#2e7d32"/><text x="40" y="226">canonical-but-wrong model verdict (0)</text>
</g>
<text x="20" y="256" font-family="sans-serif" font-size="11" fill="#555">No model emitted a legal-but-wrong verdict from its own output except passes;</text>
<text x="20" y="272" font-family="sans-serif" font-size="11" fill="#555">the 5 canonical UNVERIFIED failures are runner parse fallbacks, not model choices.</text>
</svg>
